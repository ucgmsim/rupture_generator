# The Alpine-Hope joint rupture (Rupture 71072), converted from a workflow realisation.
#
# Twenty faults, each with a magnitude of its own; together Mw 8.31. The source is
# `per_fault` because the hazard model already decided how the moment divides between
# them. The propagation is predetermined for the same reason: the hazard model chose
# which fault triggers which. The jump *points* are not carried across -- this
# generator finds them from the solved wavefront.
#
# The depth profiles are the ramps the previous config format applied implicitly:
# rise time doubled above 5 km and below 20 km, the front slowed to 0.6 over the same
# ramps, shallow rise time tied to slip above 3 km, and beta 0.5 -> 0.13 across 1-3 km.
#
# Cut at 0.25 km, about ten seconds and 3.5 GB of memory to generate; the workflow
# runs this scenario at 0.1 km, which takes over a minute and about 20 GB.

