# A crustal M6.2 on the bent Hope fault: one magnitude for the event, its correlation
# lengths from Mai & Beroza (2002). Depth profiles as in alpine_hope.toml.

seed = 1234

[geometry]
path = "hope.geojson"
crs = "EPSG:2193"
spacing_km = 0.1

[hypocentre]
segment = "hope"
strike_km = 12.0
dip_km = 6.0

[medium]
bottom_depth_km = [
    1.0,
    5.0,
    12.0,
    1000.0,
]
shear_speed_km_s = [
    1.8,
    3.2,
    3.5,
    4.6,
]
density_g_cm3 = [
    2.1,
    2.5,
    2.7,
    3.2,
]

[source]
type = "finite"
magnitude = 6.2
rake_deg = 175.0

[source.correlation]
strike_exponent = 0.5
strike_offset = 2.5
dip_exponent = 0.3333333333333333
dip_offset = 1.5

[profiles.rise_time_factor]
type = "profile"
depth_km = [
    5.0,
    8.0,
    15.0,
    20.0,
]
values = [
    2.0,
    1.0,
    1.0,
    2.0,
]

[profiles.rise_time_slip_weight]
type = "ramp"
centre_km = 2.0
half_width_km = 1.0
shallow = 0.0
deep = 1.0

[profiles.rupture_speed_factor]
type = "profile"
depth_km = [
    5.0,
    8.0,
    15.0,
    20.0,
]
values = [
    0.6,
    1.0,
    1.0,
    0.6,
]

[slip]
coefficient_of_variation = 0.9
side_taper = 0.02
top_taper = 0.0
bottom_taper = 0.0

[rise]
coefficient = 1.6
correlation = 0.9
slip_exponent = 0.5
coefficient_of_variation = 0.75

[rake]
sigma_deg = 15.0

[timing]
velocity_fraction = 0.8
offset_s = 0.1
coefficient = 0.5
correlation = 0.8
blend_sigma = 4.0

[pulse]
dt_s = 0.005

[pulse.beta]
type = "ramp"
centre_km = 2.0
half_width_km = 1.0
shallow = 0.5
deep = 0.13
