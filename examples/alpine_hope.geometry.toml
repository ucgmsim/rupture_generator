#   Alpine: George to Jacksons: 36 -> 31 trace points, worst deviation 237 m
#   Alpine: Jacksons to Kaniere: 28 -> 27 trace points, worst deviation 6 m
#   Hanmer: 13 -> 12 trace points, worst deviation 149 m
#   Hope: Conway: 13 -> 12 trace points, worst deviation 187 m
#   Kelly: 18 -> 16 trace points, worst deviation 43 m
