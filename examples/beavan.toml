# The Beavan BF15 rupture, converted from a workflow realisation: seven faults, each with
# its own magnitude, in a predetermined triggering order. Depth profiles as in
# alpine_hope.toml.
#
# Cut at 1 km so the example runs in about a second; the workflow runs it at 0.1 km.

