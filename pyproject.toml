[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-rust>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rupture-generator"
version = "0.1.0"
description = "Kinematic rupture model generation: a port of genslip v5.6.2"
readme = "README.md"
authors = [{ name = "ucgmsim" }]
requires-python = ">=3.14"
dependencies = [
    "mashumaro[toml]>=3.22",
    "numpy>=2",
    "pyproj>=3.6",
    "scipy>=1.13",
]

[project.scripts]
rupture-generator = "rupture_generator.cli:main"
rupture-view = "rupture_generator.view:main"

[project.optional-dependencies]
test = ["hypothesis>=6.151.0", "pytest>=8", "pytest-cov>=5"]
vis = ["rerun-sdk>=0.26"]

[dependency-groups]
dev = ["deptry", "ruff", "ty", "numpydoc", "py-spy"]

# `debug = false` is load-bearing, not a preference. setuptools-rust's default is
# `debug = None`, which means *auto*: an inplace build gets `--debug` and everything
# else gets `--release`. An editable install is an inplace build, so the whole
# development and profiling path silently ran an unoptimised eikonal solver -- the
# kernels exist to be fast, and `cargo` was being told not to make them.
[[tool.setuptools-rust.ext-modules]]
target = "rupture_generator.srf_parser"
path = "crates/srf/Cargo.toml"
binding = "PyO3"
debug = false

[[tool.setuptools-rust.ext-modules]]
target = "rupture_generator._kernels"
path = "crates/kernels/Cargo.toml"
binding = "PyO3"
debug = false

[tool.setuptools.packages]
find = { where = [
  "."
], include = [
  "rupture_generator*",
], exclude = [
  "tests",
  "crates",
] }

[tool.deptry]
pep621_dev_dependency_groups = ["test"]

[tool.deptry.package_module_name_map]
rerun-sdk = "rerun"

[tool.pytest.ini_options]
markers = ["slow: mark a test as slow"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
  "rupture_generator",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**.py" = ["D", "ANN001"]

[tool.npdlint]
include = ["rupture_generator"]
select = ["ALL"]
ignore = ["ES01", "SA01", "EX01"]

[tool.npdlint.per-file-ignores]
"**/__init__.py" = ["GL08"]

# Properties read as attributes, so document them as "type: summary".
[[tool.npdlint.scope]]
match = { kind = "property" }
extend-ignore = ["PR", "RT", "ES01"]
extend-select = ["PT"]
property-form = "type-line"

# Dunder methods only need to exist.
[[tool.npdlint.scope]]
match = { kind = "any-method", dunder = true }
select = ["GL08"]

# Last, so no block above re-selects a rule for them: private helpers, private
# properties included, are not part of the public API and need no docstring.
[[tool.npdlint.scope]]
match = { private = true }
skip = true

# Closures are their enclosing function's implementation, as private as a helper.
[[tool.npdlint.scope]]
match = { nested = true }
skip = true

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "crates/**/*.rs" },
]
