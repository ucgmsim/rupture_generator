[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-rust>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rupture-generator"
version = "0.1.0"
description = "Kinematic rupture model generation: a port of genslip v5.6.2"
readme = "README.md"
authors = [{ name = "ucgmsim" }]
requires-python = ">=3.12"
dependencies = [
  "h5py>=3.11",
  # Configuration. The `yaml` and `toml` extras are what make a config file readable in
  # any of three spellings without a decoder per format; `config/core.py` says why the
  # validation rides on `Annotated` rather than on a schema library.
  "mashumaro[toml,yaml]>=3.22",
  "numpy>=2",
  # The projection. `mesh.py` is the only importer: the library works in a Cartesian
  # CRS and this is the one seam that leaves it for WGS84 -- positions, and the grid
  # convergence correction that has to go with them.
  "pyproj>=3.6",
  "scipy>=1.13",
]

[project.optional-dependencies]
test = ["hypothesis>=6.151.0", "pytest>=8", "pytest-cov>=5"]

[dependency-groups]
dev = ["deptry", "ruff", "ty", "numpydoc"]

[[tool.setuptools-rust.ext-modules]]
target = "rupture_generator.srf_parser"
path = "crates/srf/Cargo.toml"
binding = "PyO3"

[[tool.setuptools-rust.ext-modules]]
target = "rupture_generator._core"
path = "crates/core/Cargo.toml"
binding = "PyO3"

[tool.setuptools.packages]
find = { where = [
  "."
], include = [
  "rupture_generator*",
], exclude = [
  "tests",
  "crates",
] }

[tool.deptry]
pep621_dev_dependency_groups = ["test"]

[tool.pytest.ini_options]
markers = ["slow: mark a test as slow"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
  "source_modelling",
  "workflow",
  "qcore",
  "IM",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**.py" = ["D"]

[tool.numpydoc_validation]
checks = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "crates/**/*.rs" },
]
