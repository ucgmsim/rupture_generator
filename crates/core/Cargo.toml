[package]
name = "rupture-generator-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Python bindings for the rupture generator."
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
genslip.workspace = true
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

["fftw"]
# Mirror genslip's Stage 1 compatibility features so the extension can be built
# either way; `--no-default-features` is the Stage 3 shape.
fftw = ["genslip/fftw"]

[lints]
workspace = true
