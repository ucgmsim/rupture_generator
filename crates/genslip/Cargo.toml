[package]
name = "genslip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kinematic rupture model generation: a port of genslip v5.6.2."

[dev-dependencies]
# Comparison assertions that print both values and the tolerance when they fail. The
# hand-written `assert!((a - b).abs() < tol)` prints "assertion failed" and nothing
# else, which is the difference between a test that tells you what broke and one that
# tells you that something did.
approx = "0.5.1"
ndarray = { version = "0.17.2", features = ["approx"] }
num-complex = "0.4.6"
proptest = "1"

[lints]
workspace = true

[dependencies]
# Every field on the fault is a 2-D array, and was a hand-rolled struct wrapping a
# `Vec` plus two extents. `grid.rs` states the axis convention this brings with it.
ndarray = "0.17.2"
num-traits = "0.2.19"
num-complex = "0.4.6"
rand = "0.10.2"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rustfft = "6.4.1"
# The error type. Pinned to what the sibling HF port uses and what is in the offline
# registry; `error.rs` says why the crate needs one at all.
thiserror = "2.0.19"
# The eleven slip-rate shapes. Each has three behaviours and they were three matches
# in two files, two of them ending in `_ =>` -- and one of those catch-alls is where
# the `urs` depth-ramp bug lived. `slip_rate.rs` says the rest.
enum_dispatch = "0.3.13"
