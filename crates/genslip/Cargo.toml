[package]
name = "genslip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kinematic rupture model generation: a port of genslip v5.6.2."

[dev-dependencies]
num-complex = "0.4.6"
proptest = "1"

["fftw"]
# Stage 1 only: links FFTW so the port can be compared against genslip bit for
# bit. Stage 3 drops it and RustFft becomes the only engine.
fftw = []

[lints]
workspace = true

[dependencies]
geographiclib-rs = "0.2.7"
num-complex = "0.4.6"
rand = "0.10.2"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rustfft = "6.4.1"
