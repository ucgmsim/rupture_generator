[package]
name = "srf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reading and writing the Standard Rupture Format, as a Python extension."
publish = false

[lib]
name = "srf_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
itertools = "0.15"
lexical-core = "1.0.6"
ndarray = "0.17"
nom = "8"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
thiserror = "2"

[lints]
workspace = true
