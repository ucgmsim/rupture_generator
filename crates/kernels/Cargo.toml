[package]
name = "kernels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The two rupture kernels — eikonal solve and pulse synthesis — as a Python extension."
publish = false

[lib]
name = "_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rustfft = "6"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
