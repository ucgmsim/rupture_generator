[package]
name = "kernels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The two rupture kernels — eikonal solve and pulse synthesis — as a Python extension."
publish = false

[lib]
name = "_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29"
# The parallel active list. meshFIM was chosen over fast marching precisely because its
# update has no ordered heap -- Fu et al.'s own convergence study ran on a GPU for that
# reason -- and `fim.rs` is where that is cashed in. A hand-rolled `std::thread` scatter
# would need its own chunking, its own join and its own panic handling; `par_chunks` is
# three lines and the work-stealing is what keeps an irregular active list balanced.
rayon = "1"
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rustfft = "6"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
