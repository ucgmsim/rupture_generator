[package]
name = "kernels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The two rupture kernels — eikonal solve and pulse synthesis — as a Python extension."
publish = false

[lib]
name = "_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["linalg", "std", "rayon"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rayon = "1.12.0"
rustfft = "6"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
