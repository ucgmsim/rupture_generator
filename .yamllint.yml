# yamllint's defaults are written for hand-authored documents, and every YAML
# file in this repo but the hook and Vale configs is a GitHub Actions workflow.
# Without this the pre-push yamllint hook fires on the workflows for things
# Actions requires.
extends: default

rules:
  # Workflows are not multi-document streams and GitHub does not want a
  # leading `---`.
  document-start: disable
  # `on:` is the Actions trigger key, not the YAML 1.1 boolean `on`.
  truthy:
    check-keys: false
  # Job names, URLs, action refs and ${{ }} expressions do not wrap, so the
  # limit leaves room for them.
  line-length:
    max: 140
    allow-non-breakable-words: true
