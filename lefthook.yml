# lefthook.yml

# Git hooks that run the same checks as CI, from ucgmsim/meta-ci-action's
# lefthook/ci.yml (pinned to v2, like the CI workflow). Set up once per clone:

#   uv sync --all-extras --dev
#   uvx lefthook install

# Turn shared checks off with `exclude_tags`; add repo-specific hooks under new names.
remotes:
  - git_url: https://github.com/ucgmsim/meta-ci-action
    ref: v2
    configs:
      - lefthook/ci.yml
pre-push:
  parallel: true
  commands:
    yaml:
      # Upstream writes this glob as "*.{yaml, yml}". The space is inside the
      # alternation, so the second branch only matches a file named "* yml"
      # and the hook never fires on a .yml.
      run: uvx yamllint {push_files}
      glob: "*.{yaml,yml}"

    vale:
      # Needs `vale sync` once, to fetch the styles named in .vale.ini.
      #
      # The same gate as the Vale workflow: any alert fails, warnings and
      # suggestions included. Vale itself exits 0 on those, and above 1 only
      # when it fails to run.
      run: |
        alerts=$(vale --output=line {push_files})
        status=$?
        if [ "$status" -gt 1 ]; then
          exit "$status"
        fi
        if [ -n "$alerts" ]; then
          echo "$alerts"
          exit 1
        fi
      glob: "*.{py,md,rs}"
